<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guardrail">
  <title>Guardrail</title>
  <defs>
    <linearGradient id="b" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="g0"></stop>
      <stop offset="1" class="g1"></stop>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.3" flood-color="#000814" flood-opacity="0.45"></feDropShadow>
    </filter>
  </defs>

  <style>
    .bg { fill: #020917; }
