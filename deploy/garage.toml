# Mirrors the values in workrave-infra's apps/garage/flux/helmrelease.yaml
# (db_engine, replication_factor, consistency_mode, bind addrs). Secrets are
# read from files generated by dev/generate-secrets.sh, never inlined here.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1
consistency_mode = "consistent"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
rpc_secret_file = "/etc/garage/secrets/rpc_secret"

bootstrap_peers = []

metadata_auto_snapshot_interval = "6h"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/etc/garage/secrets/admin_token"
metrics_token_file = "/etc/garage/secrets/metrics_token"
