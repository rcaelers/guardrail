
[workspace]
resolver = "2"
members = [
  "src/backend/api",
  "src/backend/ingestion",
  "src/backend/curator",
  "src/backend/processor",
  "src/backend/server",
  "src/common/common",
  "src/common/data",
  "src/common/email",
  "src/common/repos",
  "src/backend/testware",
  "src/backend/e2e",
  "src/web/server",
]
default-members = ["src/backend/server", "src/web/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
# Keep normal release builds suitable for CI/container builds. The expensive
# whole-program optimization path is available through `--profile maxperf`.
lto = false
opt-level = 'z'

[profile.maxperf]
inherits = "release"
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1 # line-level info only; full DWARF (debug=2) is slow to emit and link

[profile.coverage]
inherits = "dev"
opt-level = 0     # disable optimisations that can hide branches / dead code
codegen-units = 1 # required for accurate per-line/branch instrumentation
debug = 2         # full DWARF so llvm-cov maps counters back to source lines

[workspace.dependencies]

askama = "0.16.0"

# Serde / json
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Tokio
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["tracing", "io"] }

# Tower / Axum
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["full"] }
tower-sessions = "0.15.0"
axum = { version = "0.8.9", features = [
  "form",
  "query",
  "macros",
  "multipart",
  "tracing",
] }
axum-extra = { version = "0.12.6", features = ["error-response", "query"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = "0.23.43"

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "tracing-log",
  "local-time",
  "env-filter",
  "json",
] }
tracing-appender = "0.2.5"
tracing-log = "0.2.0"

# SurrealDB
surrealdb = { version = "3.2.4", features = ["kv-mem"] }

# Minidump
semver = { version = "1" }
debugid = { version = "0.8" }
minidump = { version = "0.27.0" }
minidump-processor = { version = "0.27.0" }
minidump-unwind = { version = "0.27.0", features = ["http"] }

# Misc
apalis = { version = "1.0.0-rc.9" }
apalis-codec = { version = "0.1.0-rc.9" }
apalis-core = { version = "1.0.0-rc.9" }
apalis-redis = { version = "1.0.0-rc.8" }
apalis-cron = { version = "1.0.0-rc.8" }
cron = "0.16"
argon2 = { version = "0.5.3", features = ["password-hash"] }
password-hash = { version = "0.6.1", features = ["getrandom"] }
async-trait = "0.1.92"
base64 = "0.23.1"
sha2 = "0.11.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
config = "0.15.25"
data-encoding = "2.11.1"
dyn-clone = "1.0.20"
enumflags2 = { version = "0.7.12", features = ["serde"] }
fancy-regex = "0.19.0"
futures = "0.3.34"
glob = "0.3.4"
http = "1.5.0"
indexmap = "2.14.1"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
log = "0.4.34"
natord = "1.0.9"
object_store = { version = "0.14.1", features = ["aws"] }
paste = "1.0.15"
rand = { version = "0.10.2", features = ["serde"] }
redis = { version = "1.6.0", features = [
  "tokio-comp",
  "aio",
  "connection-manager",
] }
rhai = { version = "1.26.0", features = ["serde"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.20"
time = "0.3.55"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = [
  "js",
  "v4",
  "fast-rng",
  "serde",
  "std",
] }
reqwest = { version = "0.13.4", default-features = true, features = [
  "json",
  "form",
] }
resend-rs = { version = "0.32.0", default-features = false, features = [
  "rustls-tls",
] }

