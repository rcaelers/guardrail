name: Build, Push & Sign Multiarch Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GHCR: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            file: Containerfile
            target: server
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64

          - name: server
            file: Containerfile
            target: server
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

          - name: ui
            file: Containerfile.ui
            target: ''
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64

          - name: ui
            file: Containerfile.ui
            target: ''
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

          - name: schema-sync
            file: Containerfile.schema-sync
            target: ''
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64

          - name: schema-sync
            file: Containerfile.schema-sync
            target: ''
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            CARGO_BUILD_FLAGS=--release
            CARGO_BUILD_OUTPUT_DIR=release
          push: true
          tags: ${{ env.GHCR }}-${{ matrix.name }}:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

  create-and-sign-manifests:
    name: Create & Sign Multiarch Image Manifests
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      packages: write
    needs: build
    strategy:
      matrix:
        name: [server, ui, schema-sync]

    steps:
      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3

      - name: Check CoSign version
        run: cosign version

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest for ${{ matrix.name }}
        run: |
          IMAGE=${{ env.GHCR }}-${{ matrix.name }}
          SHA_TAG="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
            docker buildx imagetools create \
              --tag ${IMAGE}:${VERSION_TAG} \
              --tag ${IMAGE}:${SHA_TAG} \
              --tag ${IMAGE}:latest \
              ${IMAGE}:amd64-${GITHUB_SHA} \
              ${IMAGE}:arm64-${GITHUB_SHA}
          else
            docker buildx imagetools create \
              --tag ${IMAGE}:${SHA_TAG} \
              --tag ${IMAGE}:latest \
              ${IMAGE}:amd64-${GITHUB_SHA} \
              ${IMAGE}:arm64-${GITHUB_SHA}
          fi

      - name: Sign multi-arch image for ${{ matrix.name }}
        run: |
          IMAGE=${{ env.GHCR }}-${{ matrix.name }}
          SHA_TAG="${GITHUB_SHA::7}"

          # Resolve the manifest digest — all tags for this build point to the same manifest,
          # so signing once by digest covers SHA_TAG, latest, and the version tag (if any).
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" | grep '^Digest:' | awk '{print $2}')
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the images
        run: |
          set -o pipefail
          IMAGE=${{ env.GHCR }}-${{ matrix.name }}
          SHA_TAG="${GITHUB_SHA::7}"

          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" | grep '^Digest:' | awk '{print $2}')

          cosign verify "${IMAGE}@${DIGEST}" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/containers.yml@refs/(heads/(main|dev)|tags/v.*)$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com | jq

      - name: Generate and attach attestation
        run: |
          IMAGE=${{ env.GHCR }}-${{ matrix.name }}
          SHA_TAG="${GITHUB_SHA::7}"

          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" | grep '^Digest:' | awk '{print $2}')
          REF="${GITHUB_REF_NAME}"

          cosign attest \
            --yes \
            --predicate <(echo '{"buildType":"github-actions","builder":{"id":"https://github.com/${{ github.repository }}/.github/workflows/containers.yml@refs/heads/'"${REF}"'"}}') \
            "${IMAGE}@${DIGEST}"

  update-dev-infra:
    name: Update development images in workrave-infra
    runs-on: ubuntu-24.04
    needs: create-and-sign-manifests
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    steps:
      # Build times vary by an order of magnitude — a cache miss on the node
      # layers can take 28 minutes against 6 for the next commit — so runs
      # finish out of order. Whichever finishes last dispatches last and wins,
      # which silently deploys an older commit over a newer one. Only the branch
      # tip may define what is deployed.
      - name: Skip if a newer commit has landed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)"
          if [ "${tip}" != "${{ github.sha }}" ]; then
            echo "::notice::superseded by ${tip:0:7}; leaving workrave-infra pointing at the newer commit"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger workrave-infra image update
        if: steps.guard.outputs.skip != 'true'
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${INFRA_DISPATCH_TOKEN}" ]; then
            echo "ERROR: INFRA_DISPATCH_TOKEN is not set. Configure it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rcaelers/workrave-infra/dispatches \
            -d '{"event_type":"update-dev-images","client_payload":{"sha":"${{ github.sha }}","services":"server schema-sync ui"}}'

  update-prod-infra:
    name: Update production images in workrave-infra
    runs-on: ubuntu-24.04
    needs: create-and-sign-manifests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      # Same ordering hazard as the dev dispatch: build times vary widely, so a
      # slow run must not repoint production at the commit it happens to carry.
      - name: Skip if a newer commit has landed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)"
          if [ "${tip}" != "${{ github.sha }}" ]; then
            echo "::notice::superseded by ${tip:0:7}; leaving workrave-infra pointing at the newer commit"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger workrave-infra image update
        if: steps.guard.outputs.skip != 'true'
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${INFRA_DISPATCH_TOKEN}" ]; then
            echo "ERROR: INFRA_DISPATCH_TOKEN is not set. Configure it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # No `tag` in the payload: workrave-infra then derives the short SHA,
          # which is what the build actually publishes. Sending `github.ref_name`
          # was only correct for tag pushes; this job fires on pushes to the
          # main branch, so it sent the literal "main" — a tag that is never
          # published, leaving every guardrail workload unpullable.
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rcaelers/workrave-infra/dispatches \
            -d '{"event_type":"update-prod-images","client_payload":{"sha":"${{ github.sha }}","services":"server schema-sync ui"}}'
